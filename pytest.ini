[pytest]
DJANGO_SETTINGS_MODULE = ai_ra_saas.settings
python_files = tests.py test_*.py *_test.py
addopts = -m "not integration and not external_api"
markers =
    integration: Harici servis veya uctan uca entegrasyon testleri.
    external_api: Gercek dis API cagrisi yapan testler.
    contract: Hizli sozlesme/format testleri.
